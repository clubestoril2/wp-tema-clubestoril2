<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Patrón de fondo de la presentación de la portada (se usa como máscara:
       solo cuenta la forma; el color lo pone el CSS). Deportes olímpicos y
       cultura. Trazos propios. -->
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Balón de fútbol -->
    <g transform="translate(40 40)">
      <circle r="18"/>
      <path d="M0-7l7 5-3 8h-8l-3-8z M0-7v-11 M7-2l10-4 M4 6l6 9 M-4 6l-6 9 M-7-2l-10-4"/>
    </g>
    <!-- Libro abierto -->
    <g transform="translate(130 30) rotate(-8)">
      <path d="M0 4c-8-5-17-6-25-4v28c8-2 17-1 25 4 8-5 17-6 25-4V0C17-2 8-1 0 4z M0 4v28"/>
    </g>
    <!-- Raqueta de tenis -->
    <g transform="translate(220 45) rotate(35)">
      <ellipse rx="13" ry="17"/>
      <path d="M0 17v20 M-8-8h16 M-10 0h20 M-8 8h16 M-5-14v28 M5-14v28"/>
    </g>
    <!-- Máscaras de teatro -->
    <g transform="translate(310 40)">
      <path d="M-22-14h20v12c0 9-5 15-10 15s-10-6-10-15z"/>
      <path d="M-17-5h3 M-9-5h3 M-17 4c3 3 8 3 11 0"/>
      <path d="M2-8h20V4c0 9-5 15-10 15S2 13 2 4z"/>
      <path d="M7 1h3 M15 1h3 M7 13c3-3 8-3 11 0"/>
    </g>
    <!-- Aros olímpicos -->
    <g transform="translate(60 130)">
      <circle cx="-22" r="10"/><circle r="10"/><circle cx="22" r="10"/>
      <circle cx="-11" cy="10" r="10"/><circle cx="11" cy="10" r="10"/>
    </g>
    <!-- Lápiz -->
    <g transform="translate(150 125) rotate(40)">
      <path d="M-5-26h10v40l-5 10-5-10z M-5 14h10 M-5-18h10"/>
    </g>
    <!-- Pesa -->
    <g transform="translate(240 130) rotate(-20)">
      <path d="M-14 0h28 M-14-10v20 M-19-7v14 M14-10v20 M19-7v14"/>
    </g>
    <!-- Nota musical -->
    <g transform="translate(320 125)">
      <path d="M-4 12V-16l16-4v26"/>
      <ellipse cx="-9" cy="12" rx="6" ry="4.5"/>
      <ellipse cx="7" cy="6" rx="6" ry="4.5"/>
    </g>
    <!-- Natación (olas) -->
    <g transform="translate(35 225)">
      <path d="M-20-4c5-5 10-5 15 0s10 5 15 0 10-5 15 0 M-20 8c5-5 10-5 15 0s10 5 15 0 10-5 15 0"/>
      <circle cx="10" cy="-16" r="4"/>
    </g>
    <!-- Paleta de pintura -->
    <g transform="translate(125 220) rotate(-15)">
      <path d="M0-18c-14 0-22 9-22 18s7 18 18 18c4 0 5-3 3-6s0-6 4-6h6c6 0 9-4 9-8 0-9-8-16-18-16z"/>
      <circle cx="-10" cy="-2" r="2.5"/><circle cx="-3" cy="-10" r="2.5"/><circle cx="8" cy="-8" r="2.5"/>
    </g>
    <!-- Balón de baloncesto -->
    <g transform="translate(215 225)">
      <circle r="18"/>
      <path d="M-18 0h36 M0-18v36 M-12-13c6 7 6 19 0 26 M12-13c-6 7-6 19 0 26"/>
    </g>
    <!-- Libros apilados -->
    <g transform="translate(305 225)">
      <rect x="-20" y="4" width="40" height="10" rx="2"/>
      <rect x="-16" y="-6" width="34" height="10" rx="2"/>
      <rect x="-18" y="-16" width="36" height="10" rx="2" transform="rotate(-6)"/>
    </g>
    <!-- Bicicleta -->
    <g transform="translate(70 315)">
      <circle cx="-17" cy="6" r="11"/><circle cx="17" cy="6" r="11"/>
      <path d="M-17 6l9-17h17l8 17 M-8-11l9 17h-18 M1-15h8"/>
    </g>
    <!-- Medalla -->
    <g transform="translate(165 310)">
      <path d="M-9-24l9 14 9-14"/>
      <circle cy="2" r="12"/>
      <path d="M0-4l2 4 4 .5-3 3 1 4-4-2-4 2 1-4-3-3 4-.5z"/>
    </g>
    <!-- Pelota de tenis de mesa y pala -->
    <g transform="translate(255 315) rotate(25)">
      <circle cy="-6" r="13"/>
      <path d="M0 7v14"/>
      <circle cx="20" cy="-18" r="4"/>
    </g>
    <!-- Cámara de fotos -->
    <g transform="translate(330 310)">
      <rect x="-18" y="-10" width="36" height="24" rx="4"/>
      <path d="M-7-10l3-5h8l3 5"/>
      <circle cy="2" r="7"/>
    </g>
  </g>
</svg>
